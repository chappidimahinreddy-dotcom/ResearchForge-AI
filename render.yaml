services:
  - type: web
    name: researchforge-ai-backend
    env: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENALEX_API_KEY
        sync: false
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false
      - key: CROSSREF_MAILTO
        sync: false
      - key: WEB_SEARCH_PROVIDER
        value: tavily
      - key: WEB_SEARCH_API_KEY
        sync: false

